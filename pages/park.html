<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking - Vue d'ensemble</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- CSS -->
    <link href="../css/main.css" rel="stylesheet">
    <link href="../css/components/sidebar.css" rel="stylesheet">
    <link href="../css/components/topbar.css" rel="stylesheet">
    <link href="../css/pages/park.css" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar container -->
        <div id="sidebar-container"></div>
        
        <div class="main-content">
            <!-- Topbar -->
            <div id="topbar-container"></div>
            
            <div class="content-wrapper">
                <div class="parking-header">
                    <h2><i class="fas fa-parking"></i> Vue D'ensemble</h2>
                    <div class="filter-bar">
                        <span class="filter-label">Trier par</span>
                        <select class="filter-select" id="filterEtage" onchange="ParkingPage.filtrerEtage(this.value)">
                            <option value="tous">Tous les étages</option>
                            <option value="0">Étage 0 (RDC)</option>
                            <option value="1">Étage 1</option>
                            <option value="2">Étage 2</option>
                            <option value="3">Étage 3</option>
                        </select>
                        <select class="filter-select" id="filterEmplacement" onchange="ParkingPage.filtrerEmplacement(this.value)">
                            <option value="tous">Tous les emplacements</option>
                            <option value="libre"><i class="fas fa-circle" style="color: #28a745;"></i> Libre</option>
                            <option value="occupe"><i class="fas fa-circle" style="color: #dc3545;"></i> Occupé</option>
                            <option value="reserve"><i class="fas fa-circle" style="color: #ffc107;"></i> Réservé</option>
                        </select>
                    </div>
                    <div class="action-btns">
                        <button class="btn-icon btn-add" onclick="ParkingPage.openAddSpotModal()">
                            <i class="fas fa-plus"></i>
                        </button>
                        <button class="btn-icon btn-edit" onclick="ParkingPage.exportMap()">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                </div>

                <p class="update-time" id="updateTime"><i class="fas fa-clock"></i> Mis à jour il y a 2 min</p>
                
                <div class="parking-grid" id="parkingGrid">
                    <div class="text-center">
                        <i class="fas fa-spinner fa-spin"></i> Chargement...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Détails Place -->
    <div class="modal" id="spotModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-info-circle"></i> Détails de la place</h2>
                <button class="modal-close" onclick="ParkingPage.closeSpotModal()">&times;</button>
            </div>
            <div id="spotDetails"></div>
        </div>
    </div>

    <!-- Modal Assignation Véhicule -->
    <div class="modal" id="assignVehicleModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-car"></i> Assigner un véhicule</h2>
                <button class="modal-close" onclick="ParkingPage.closeAssignModal()">&times;</button>
            </div>
            <form id="assignForm">
                <input type="hidden" id="assignSpotId">
                <div class="form-group">
                    <label><i class="fas fa-truck"></i> Véhicule</label>
                    <select class="form-control" id="vehicleSelect" required>
                        <option value="">Sélectionner un véhicule</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Client</label>
                    <select class="form-control" id="clientSelect" required>
                        <option value="">Sélectionner un client</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-outline" onclick="ParkingPage.closeAssignModal()">
                        <i class="fas fa-times"></i> Annuler
                    </button>
                    <button type="submit" class="btn-success">
                        <i class="fas fa-check"></i> Assigner
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ajouter une place -->
    <div class="modal" id="addSpotModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-plus-circle"></i> Ajouter une place</h2>
                <button class="modal-close" onclick="ParkingPage.closeAddSpotModal()">&times;</button>
            </div>
            <form id="addSpotForm">
                <div class="form-group">
                    <label><i class="fas fa-hashtag"></i> Numéro de place</label>
                    <input type="text" class="form-control" id="spaceNumber" placeholder="Ex: A01" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-building"></i> Étage</label>
                    <select class="form-control" id="floorNumber" required>
                        <option value="0">RDC</option>
                        <option value="1">Étage 1</option>
                        <option value="2">Étage 2</option>
                        <option value="3">Étage 3</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-map-marker-alt"></i> Zone/Section</label>
                    <select class="form-control" id="section" required>
                        <option value="A">Zone A</option>
                        <option value="B">Zone B</option>
                        <option value="C">Zone C</option>
                        <option value="D">Zone D</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-money-bill"></i> Tarif horaire (FCFA)</label>
                    <input type="number" class="form-control" id="hourlyRate" value="1500" required>
                </div>
                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="isHandiAccessible">
                        <span><i class="fas fa-wheelchair"></i> Place accessible PMR</span>
                    </label>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-outline" onclick="ParkingPage.closeAddSpotModal()">
                        <i class="fas fa-times"></i> Annuler
                    </button>
                    <button type="submit" class="btn-success">
                        <i class="fas fa-save"></i> Ajouter
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components/sidebar.js"></script>
    <script src="../assets/js/components/topbar.js"></script>
    <script src="../assets/js/pages/park.js"></script>
</body>
</html>
